  # LO1 Outer:
  LO1 Outer:
    type: contour
    fixed_head: V3 Foveal Point
    figure_grid:
      - ["angle", "eccen"]
      - ["curvature", "vexpl"]
  # Isoecentricity contours:
  0.5 Degrees Eccentricity:
    type: contour
    figure_grid:
      - ["eccen_0.5", "angle"]
      - ["eccen", "vexpl"]
  1.0 Degrees Eccentricity:
    type: contour
    figure_grid:
      - ["eccen_1.0", "angle"]
      - ["eccen", "vexpl"]
  2.0 Degrees Eccentricity:
    type: contour
