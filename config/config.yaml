      - ["eccen", "vexpl"]
  4.0 Degrees Eccentricity:
    type: contour
    figure_grid:
      - ["eccen_4.0", "angle"]
      - ["eccen", "vexpl"]
  7.0 Degrees Eccentricity:
    type: contour
    figure_grid:
      - ["eccen_7.0", "angle"]
      - ["eccen", "vexpl"]
    filter: |
      return target["Dataset"] != "NSD"
  11.0 Degrees Eccentricity:
    type: contour
    figure_grid:
      - ["eccen_11.0", "angle"]
      - ["eccen", "vexpl"]
    filter: |
      return target["Dataset"] in ( "NYU-Retinotopy", )


figures:
  _: |
    # prepare (formatted) target information for figure code below
    hemisphere = target["Hemisphere"]  # string
    fs_hemi    = f"{hemisphere[0].lower()}h"

    # prepare property values for figure
    values = target["flatmap"].properties[key]

    # get property function and kwargs for angle property
    prop_color  = PROPERTY_KWARGS[key]["func"](values, fs_hemi)
    prop_kwargs = PROPERTY_KWARGS[key]["kwargs"]

    ny.cortex_plot(
      mesh = target["flatmap"], color = prop_color, axes = axes, **prop_kwargs
    )
  term: |
    # figure aesthetics and limits
    xy = target["flatmap"].coordinates
    (xmin, ymin) = np.min(xy, axis = 1)
    (xmax, ymax) = np.max(xy, axis = 1)
    axes.set_xlim((xmin, xmax))
    axes.set_ylim((ymin, ymax))


viewer:
  # Expected `faces` shape: [ n_faces, 3 ]
  faces: |
    return target["cortex"].tess.faces.T
  
  # Expected `coordinates` shape: [ n_vertices, xyz (3) ]
  coordinates: 
    midgray: |
      return target["cortex"].surfaces["midgray"].coordinates.T
    inflated: |
      return target["cortex"].surfaces["inflated"].coordinates.T
  
  # Must be have matching coordinates fields. 
  morph_between: [ "midgray", "inflated" ]

  # Expected overlay shape: [ n_vertices, rgb (3) ]
  overlays: 
    curvature: |
      # return curvature colors for cortical mesh plot
      return ny.graphics.cortex_plot_colors(target["cortex"])[:,:3]
    _: |
      # prepare (formatted) target information for figure code below
      hemisphere = target["Hemisphere"]  # string
      fs_hemi    = f"{hemisphere[0].lower()}h"

      # prepare colormap name and values for figure
      values = target["cortex"].properties[key]

      # get property function and kwargs for angle property
      prop_color  = PROPERTY_KWARGS[key]["func"](values, fs_hemi)
      prop_kwargs = PROPERTY_KWARGS[key]["kwargs"]

      # return vertex colors for cortical mesh plot
      return ny.graphics.cortex_plot_colors(target["cortex"], 
        color = prop_color, **prop_kwargs)[:,:3]
  
  # code to convert canvas (2d) coordinates to viewer (3d) coordinates, 
  # Input: `target` (as above), 
  #        `points` from canvas annotations (n_points, 2), and 
  #        `mesh_coordinates` (n_vertices, 3) 
  # Output: viewer coordinates (n_points, 3)
  canvas_to_viewer: |
    # prepare (formatted) target information for figure code below
    hemisphere = target["Hemisphere"]  # string
    fs_hemi    = f"{hemisphere[0].lower()}h"

    # convert canvas (2d) coordinates to barycentric coordinates
    flatmap_address  = fsa_flatmap[fs_hemi].address(points)
    bary_faces       = flatmap_address["faces"]       # (3, n_faces)
    bary_coordinates = flatmap_address["coordinates"] # (2, n_points)
    
    # sample barycentric coordinates on 3d mesh coordinates
    tx = mesh_coordinates[bary_faces] # (n_vertices, n_points, n_triangles)
    tx = np.transpose(tx, (0, 2, 1))  # (n_vertices, n_triangles, n_points)
    
    # return cartesian coordinates for each point along the mesh 
    return barycentric_to_cartesian(tx, bary_coordinates).T # (n_points, 3)